[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, bandit (security), isort
select = ["E", "F", "W", "B", "UP", "SIM", "S", "I"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks results; SQL strings in tests are fixed text;
# real sshd log lines are kept whole even when longer than 120 characters.
"tests/**" = ["S101", "S608", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
